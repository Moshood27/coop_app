services:
  proxy:
    image: nginx:1.25-alpine
    container_name: attaqwa-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/html/public/app
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/conf.d/.htpasswd:/etc/nginx/conf.d/.htpasswd
    networks:
      - attaqwa-network
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attaqwa-app
    restart: unless-stopped
    env_file: [ ".env.dev" ]
    environment:
      - PHP_MEMORY_LIMIT=512M
    volumes:
      - ./backend:/var/www/html
      - ./.env.dev:/var/www/html/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - attaqwa-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: attaqwa-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    env_file:
      - .env.dev
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pass_attaqwa}
    command: --mysql-native-password=ON
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - attaqwa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: attaqwa-redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-ANIbaba1122?}
    networks:
      - attaqwa-network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attaqwa-worker
    restart: unless-stopped
    command: php artisan horizon
    env_file: [ ".env.dev" ]
    volumes:
      - ./backend:/var/www/html
      - ./.env.dev:/var/www/html/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - attaqwa-network
    depends_on:
      - db
      - redis
      - app

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attaqwa-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    env_file:
      - .env.dev
    volumes:
      - ./backend:/var/www/html
      - ./.env.dev:/var/www/html/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - attaqwa-network
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attaqwa-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: [ ".env.dev" ]
    volumes:
      - ./backend:/var/www/html
      - ./.env.dev:/var/www/html/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - attaqwa-network
    depends_on:
      - db
      - app

  phpmyadmin:
    build:
      context: .
      dockerfile: docker/phpmyadmin/Dockerfile
    container_name: attaqwa-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8081/}
      UPLOAD_LIMIT: 64M
    networks:
      - attaqwa-network
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: attaqwa-mailpit
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - attaqwa-network

  # Optional: Frontend dev server (Vite)
  # Uncomment if you want to run the frontend in a container
  # frontend:
  #   image: node:20-alpine
  #   container_name: attaqwa-frontend
  #   working_dir: /app
  #   volumes:
  #     - ./frontend:/app
  #   environment:
  #     - VITE_PROXY_TARGET=http://proxy
  #   ports:
  #     - "${FRONTEND_PORT:-5174}:5174"
  #   command: npm run dev -- --host
  #   networks:
  #     - attaqwa-network

  # Optional: Ngrok for local webhook testing
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   restart: unless-stopped
  #   environment:
  #     NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  #   command:
  #     - http
  #     - proxy:80
  #   ports:
  #     - "${FORWARD_NGROK_INSPECT_PORT:-4040}:4040"
  #   networks:
  #     - attaqwa-network
  #   depends_on:
  #     - proxy

networks:
  attaqwa-network:
    driver: bridge

volumes:
  db-data:
    driver: local
