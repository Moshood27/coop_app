map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # --- PROXY SETTINGS ---
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;

    # --- PERFORMANCE ENHANCEMENTS ---
    # 1. GZIP COMPRESSION (Makes your JS/CSS 70% smaller)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # 2. OPTIMIZED BUFFERS (Prevents slow disk-writing for large requests)
    client_max_body_size 64M;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # --- PHPMYADMIN ---
    location ^~ /phpmyadmin/ {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- SECURITY HARDENING ---
    # 1. DENY ACCESS TO SENSITIVE FILES AND DOTFILES
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. BLOCK COMMON BOT PROBES (INCLUDING ENCODED ATTEMPTS)
    location ~* (?:wp-admin|wp-login|xmlrpc|\.env|\.bak|\.config|\.sql|\.log|\.sh|stripe/webhook_secret|webhooks/incoming/stripe) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- COMBINED FRONTEND & WEBSOCKET BLOCK ---
    location /app/ {
        # Security headers for the SPA
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://js.paystack.co https://static.cloudflareinsights.com https://attaqwacooposg.com https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src 'self' https://fonts.gstatic.com https://fonts.bunny.net data:; img-src 'self' data: https: blob: https://attaqwacooposg.com; connect-src 'self' https: wss: https://static.cloudflareinsights.com; frame-src 'self' https://js.paystack.co https://checkout.flutterwave.com https://*.monnify.com https://attaqwacooposg.com; object-src 'none'; base-uri 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # If the browser is asking for a WebSocket, send it to Reverb
        if ($http_upgrade = "websocket") {
            proxy_pass http://reverb:8080;
        }

        # Fallback to Vue for normal page requests
        root /var/www/html/public;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # --- REVERB REST API ---
    location /apps/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
    }


    # 2. LARAVEL BACKEND
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM (The logic engine)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param HTTPS on;

        # Performance Tweaks for PHP
        fastcgi_read_timeout 300;
        fastcgi_keep_conn on;
    }

    # 4. STORAGE OPTIMIZATION
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;

        location ~* \.(?:jpg|jpeg|gif|png|ico|webp)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    location /storage/upload/ {
        alias /var/www/html/public/upload/;
        try_files $uri $uri/ =404;

        location ~* \.(?:jpg|jpeg|gif|png|ico|webp)$ {
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    location @laravel_storage_fallback {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /app/telescope-api {
        try_files $uri $uri/ /index.php?$query_string;
    }
}