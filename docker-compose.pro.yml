services:
  proxy:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: attaqwa-nginx
    restart: unless-stopped
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/public/upload:/var/www/html/public/upload
    networks:
      - attaqwa-network
      - gateway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: attaqwa-app
    restart: unless-stopped
    env_file: [ ".env" ]
    environment:
      - PHP_MEMORY_LIMIT=512M
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/public/upload:/var/www/html/public/upload
      - ./backend/storage/logs:/var/www/html/storage/logs
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - attaqwa-network
      - gateway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: attaqwa-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command: --mysql-native-password=ON
    volumes:
      - old-db-data:/var/lib/mysql
    networks:
      - attaqwa-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: attaqwa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ANIbaba1122?}
    networks:
      - attaqwa-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: attaqwa-worker
    hostname: attaqwa-queue-worker
    restart: unless-stopped
    command: php artisan horizon --environment=production
    env_file: [ ".env" ]
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/public/upload:/var/www/html/public/upload
      - ./backend/storage/logs:/var/www/html/storage/logs
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - attaqwa-network
      - gateway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - db
      - redis
      - app

  reverb:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: attaqwa-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/public/upload:/var/www/html/public/upload
      - ./backend/storage/logs:/var/www/html/storage/logs
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - attaqwa-network
      - gateway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: attaqwa-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: [ ".env" ]
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/public/upload:/var/www/html/public/upload
      - ./backend/storage/logs:/var/www/html/storage/logs
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - attaqwa-network
      - gateway-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - db
      - app

  phpmyadmin:
    build:
      context: .
      dockerfile: docker/phpmyadmin/Dockerfile
    container_name: attaqwa-phpmyadmin
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8081/}
      UPLOAD_LIMIT: 64M
    networks:
      - attaqwa-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

networks:
  attaqwa-network:
    driver: bridge
  gateway-network:
    external: true

volumes:
  old-db-data:
    external: true
    name: coop2_db-data
